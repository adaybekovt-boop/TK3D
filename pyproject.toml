[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tk3d"
version = "0.1.0"
description = "TK3D deterministic Blender geometry compiler and searchable generator source catalog"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TK3D contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geoforge = ["catalog/*.json"]
